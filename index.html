    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 1.5rem;
      overflow-x: hidden;

      background-image:

        url("surreal-cherry-3840x2160-26233.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .viewport-box {
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      color: #fff;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
    }

    .slide-out-left {
      transform: translateX(-120%);
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .slide-in-left {
      animation: slideFromLeft 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes slideFromLeft {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    h1 {
      font-size: 1.85rem;
      text-align: center;
      margin-bottom: 0.35rem;
    }

    p.subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 2rem;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .pass-input {
      width: 100%;
      padding: 0.9rem 1.4rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      transition: border 0.2s, background 0.2s;
    }

    .pass-input:focus {
      border-color: #f472b6;
      background: rgba(255, 255, 255, 0.16);
    }

    .unlock-btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f472b6, #db2777);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .unlock-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .error-msg {
      color: #fda4af;
      font-size: 0.88rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
    }

    #noteContainer {
      display: none;
      background: rgba(255, 255, 255, 0.14);
    }

    .note-header {
      font-family: 'Pacifico', cursive;
      font-size: 2.4rem;
      color: #f472b6;
      margin-bottom: 1.2rem;
      font-weight: 400;
    }

    .note-content {
      font-family: 'Pacifico', cursive;
      font-size: 1.75rem;
      line-height: 1.8;
      color: #fdf2f8;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-block;
      padding: 0.7rem 1.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: #fce7f3;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
  </style>

    const targetFriend = (urlParams.get('to') || '').toLowerCase().trim();

    const heading = document.getElementById("friendHeading");
    const subtitle = document.getElementById("friendSubtitle");
    const errorMsg = document.getElementById("errorMsg");

    // Personalize the screen immediately based on the URL
    if (targetFriend && VAULT[targetFriend]) {
      heading.textContent = "For " + VAULT[targetFriend].displayName;
      subtitle.textContent = "Enter your secret key to reveal your note";
    } else if (targetFriend) {
      heading.textContent = "Note Not Found";
      subtitle.textContent = "This personal note link is invalid.";
      document.querySelector(".input-box").style.display = "none";
    }

    async function unlockPersonalNote() {
      const pass = document.getElementById("passInput").value.trim();
      errorMsg.textContent = "";

      if (!targetFriend || !VAULT[targetFriend]) {
        errorMsg.textContent = "Invalid recipient link.";
        return;
      }

      if (!pass) {
        errorMsg.textContent = "Please enter your passkey.";
        return;
      }

      const record = VAULT[targetFriend];

      try {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]
        );

        const salt = new Uint8Array(record.salt.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const iv = new Uint8Array(record.iv.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const cipherData = new Uint8Array(record.ciphertext.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherData);
        const dec = new TextDecoder();
        const finalMessage = dec.decode(decrypted);

        // Slide out list card to the left and reveal note
        const listCard = document.getElementById("listCard");
        const noteContainer = document.getElementById("noteContainer");

        listCard.classList.add("slide-out-left");

        setTimeout(() => {
          listCard.style.display = "none";
          document.getElementById("displayRecipient").textContent = "Dear " + record.displayName + ",";
          document.getElementById("displayNote").textContent = finalMessage;

          noteContainer.style.display = "block";
          noteContainer.classList.add("slide-in-left");
        }, 300);

      } catch (err) {
        errorMsg.textContent = "Incorrect passkey. Please try again.";
      }
    }

    // Allow Enter key to submit
    document.getElementById("passInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlockPersonalNote();
    });
  </script>
</body>
